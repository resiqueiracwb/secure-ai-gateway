name: Release Develop into Main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or reuse release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main develop

          commits_to_release="$(git rev-list --count origin/main..origin/develop)"
          if [ "$commits_to_release" -eq 0 ]; then
            echo "No commits to release from develop into main."
            exit 0
          fi

          existing_pr="$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Release pull request already exists: $existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "release: develop -> main" \
            --body "Automated release pull request from develop into main."